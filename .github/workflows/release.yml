name: Release

# Runs when a GitHub release is published. The release's tag must be v<version>, matching
# package.json, and its notes are the changelog. A release marked as a pre-release is built as one.
# The workflow builds the .vsix, attaches it to the release and publishes it:
# - to the Marketplace when the AZURE_CLIENT_ID and AZURE_TENANT_ID variables are set. They name
#   an Entra ID app that signs in from the `marketplace` environment and is a member of the publisher.
# - to Open VSX when the OVSX_PAT secret is set.
# Run it by hand to print the app's Marketplace user ID, which is what Members > Add asks for.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "The release tag $TAG doesn't match $expected from package.json" >&2
            exit 1
          fi

      - name: Build the .vsix
        run: |
          if [ "$PRE" = true ]; then
            npm run package -- --pre-release --out "git-sift-${TAG#v}.vsix"
          else
            npm run package -- --out "git-sift-${TAG#v}.vsix"
          fi

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "git-sift-${TAG#v}.vsix" --clobber

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT isn't set; skipping Open VSX."
            exit 0
          fi
          flags=""
          if [ "$PRE" = true ]; then flags="--pre-release"; fi
          npx --yes ovsx publish "git-sift-${TAG#v}.vsix" -p "$OVSX_PAT" $flags

  marketplace:
    needs: release
    if: ${{ !failure() && !cancelled() && vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Show the app's Marketplace user ID
        run: |
          az rest --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            -u "https://app.vssps.visualstudio.com/_apis/connectionData" \
            --query authenticatedUser.id -o tsv

      - name: Publish to the Marketplace
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "git-sift-${TAG#v}.vsix"
          npx --yes @vscode/vsce@3 publish --packagePath "git-sift-${TAG#v}.vsix" --azure-credential
