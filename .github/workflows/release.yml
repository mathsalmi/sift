name: Release

# Runs when a GitHub release is published. The release's tag must be v<version>, matching
# package.json, and its notes are the changelog. A release marked as a pre-release is built as one.
# The workflow builds the .vsix and attaches it to the release. Upload that file on
# https://marketplace.visualstudio.com/manage (the Marketplace no longer takes tokens).
# It also publishes to Open VSX when the OVSX_PAT secret is set.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "The release tag $TAG doesn't match $expected from package.json" >&2
            exit 1
          fi

      - name: Build the .vsix
        run: |
          if [ "$PRE" = true ]; then
            npm run package -- --pre-release --out "sift-${TAG#v}.vsix"
          else
            npm run package -- --out "sift-${TAG#v}.vsix"
          fi

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "sift-${TAG#v}.vsix" --clobber

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT isn't set; skipping Open VSX."
            exit 0
          fi
          flags=""
          if [ "$PRE" = true ]; then flags="--pre-release"; fi
          npx --yes ovsx publish "sift-${TAG#v}.vsix" -p "$OVSX_PAT" $flags
