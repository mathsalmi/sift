name: Release

# Runs when a GitHub release is published. The release's tag must be v<version>, matching
# package.json, and its notes are the changelog. A release marked as a pre-release is built as one.
# The workflow builds the .vsix, attaches it to the release and publishes it:
# - to the Marketplace when the AZURE_CLIENT_ID and AZURE_TENANT_ID variables are set. They name
#   an Entra ID app that signs in from the `marketplace` environment and is a member of the publisher.
# - to Open VSX: with the OVSX_PAT secret when it's set (it also creates the msalmi namespace),
#   otherwise as the trusted publisher registered for this workflow on open-vsx.org.
# Run it by hand with a tag to publish that release again (versions already published are skipped),
# or without one to print the app's Marketplace user ID, which is what Members > Add asks for.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish again, such as v1.0.2 (empty to only print the Marketplace ID)
        required: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Check the tag matches package.json
        run: |
          echo "PRE=$(gh release view "$TAG" --json isPrerelease -q .isPrerelease)" >> "$GITHUB_ENV"
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "The release tag $TAG doesn't match $expected from package.json" >&2
            exit 1
          fi

      - name: Build the .vsix
        run: |
          if [ "$PRE" = true ]; then
            npm run package -- --pre-release --out "git-sift-${TAG#v}.vsix"
          else
            npm run package -- --out "git-sift-${TAG#v}.vsix"
          fi

      - name: Attach it to the release
        run: gh release upload "$TAG" "git-sift-${TAG#v}.vsix" --clobber

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          vsix="git-sift-${TAG#v}.vsix"
          flags="--skip-duplicate"
          if [ "$PRE" = true ]; then flags="$flags --pre-release"; fi
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx create-namespace msalmi -p "$OVSX_PAT" || true
            npx --yes ovsx publish "$vsix" -p "$OVSX_PAT" $flags
          else
            npx --yes ovsx publish "$vsix" --trusted-publishing $flags
          fi

  marketplace:
    needs: release
    if: ${{ !failure() && !cancelled() && vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Show the app's Marketplace user ID
        run: |
          az rest --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            -u "https://app.vssps.visualstudio.com/_apis/connectionData" \
            --query authenticatedUser.id -o tsv

      - name: Publish to the Marketplace
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "git-sift-${TAG#v}.vsix"
          npx --yes @vscode/vsce@3 publish --packagePath "git-sift-${TAG#v}.vsix" --azure-credential --skip-duplicate
